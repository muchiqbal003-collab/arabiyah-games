/* ============================================================
   ALGORITMA TTS BARU — LEBIH PINTAR
   Strategi:
   1. Kata terpanjang ditaruh di tengah (mendatar).
   2. Kata berikutnya dicoba di semua posisi yang memungkinkan
      dengan huruf yang sama (semua kombinasi).
   3. Setiap kandidat penempatan diberi SKOR:
      +10 per huruf yang bersilangan dengan kata lain
      -5 jika jarak dari cluster utama terlalu jauh
      -3 jika menciptakan "isolated word" (tidak bersilangan)
   4. Pilih penempatan dengan skor tertinggi.
   5. Kalau tidak ada yang bisa disilang, taruh dekat cluster.
============================================================ */

function createEmptyGrid(size) {
  return Array.from({ length: size }, () => Array.from({ length: size }, () => null));
}

function canPlaceWord(grid, word, row, col, dir, size) {
  const len = word.length;

  // Cek batas
  if (dir === "across") {
    if (col < 0 || col + len > size) return false;
    if (row < 0 || row >= size) return false;
  } else {
    if (row < 0 || row + len > size) return false;
    if (col < 0 || col >= size) return false;
  }

  let crossings = 0;

  for (let i = 0; i < len; i++) {
    const r = dir === "across" ? row : row + i;
    const c = dir === "across" ? col + i : col;

    const existing = grid[r][c];

    if (existing !== null) {
      // Sel sudah terisi: harus sama hurufnya (persilangan)
      if (existing !== word[i]) return false;
      crossings++;
    } else {
      // Sel kosong: cek tetangga tegak lurus harus kosong
      if (dir === "across") {
        if (r > 0 && grid[r-1][c] !== null) return false;
        if (r < size-1 && grid[r+1][c] !== null) return false;
      } else {
        if (c > 0 && grid[r][c-1] !== null) return false;
        if (c < size-1 && grid[r][c+1] !== null) return false;
      }
    }
  }

  // Cek ujung sebelum & sesudah (harus kosong)
  if (dir === "across") {
    if (col > 0 && grid[row][col-1] !== null) return false;
    if (col + len < size && grid[row][col+len] !== null) return false;
  } else {
    if (row > 0 && grid[row-1][col] !== null) return false;
    if (row + len < size && grid[row+len][col] !== null) return false;
  }

  // Minimal harus ada 1 persilangan (kecuali kata pertama)
  return { ok: true, crossings };
}

function placeWordOnGrid(grid, word, row, col, dir) {
  const positions = [];
  for (let i = 0; i < word.length; i++) {
    const r = dir === "across" ? row : row + i;
    const c = dir === "across" ? col + i : col;
    grid[r][c] = word[i];
    positions.push({ r, c, ch: word[i] });
  }
  return positions;
}

function buildCrossword(words) {
  const SIZE = 50;
  const grid = createEmptyGrid(SIZE);
  const placements = [];

  // Urutkan kata berdasarkan panjang (terpanjang dulu)
  const sortedWords = [...words].sort((a, b) => b.answer.length - a.answer.length);

  // Kata pertama: taruh di tengah, mendatar
  const first = sortedWords[0];
  const centerR = Math.floor(SIZE / 2);
  const centerC = Math.floor((SIZE - first.answer.length) / 2);
  placeWordOnGrid(grid, first.answer, centerR, centerC, "across");
  placements.push({
    answer: first.answer,
    clue: first.clue,
    row: centerR,
    col: centerC,
    dir: "across"
  });

  // Kata berikutnya
  for (let w = 1; w < sortedWords.length; w++) {
    const word = sortedWords[w];
    let bestPlacement = null;
    let bestScore = -Infinity;

    // Coba semua kata yang sudah ditempatkan
    for (const existing of placements) {
      // Coba setiap huruf di kata existing
      for (let i = 0; i < existing.answer.length; i++) {
        const exCh = existing.answer[i];
        const exR = existing.dir === "across" ? existing.row : existing.row + i;
        const exC = existing.dir === "across" ? existing.col + i : existing.col;

        // Coba setiap huruf di kata baru
        for (let j = 0; j < word.answer.length; j++) {
          if (word.answer[j] !== exCh) continue;

          // Coba 2 arah: menurun & mendatar (berlawanan dengan existing)
          const dirs = existing.dir === "across" ? ["down"] : ["across"];

          for (const dir of dirs) {
            const newRow = dir === "down" ? exR - j : exR;
            const newCol = dir === "across" ? exC - j : exC;

            const result = canPlaceWord(grid, word.answer, newRow, newCol, dir, SIZE);
            if (!result.ok) continue;

            // Hitung skor
            let score = result.crossings * 10;

            // Bonus: dekat dengan cluster utama (dekat dengan pusat grid)
            const distToCenter = Math.abs(newRow - centerR) + Math.abs(newCol - centerC);
            score -= distToCenter * 0.5;

            // Bonus: lebih dari 1 persilangan
            if (result.crossings > 1) score += result.crossings * 5;

            if (score > bestScore) {
              bestScore = score;
              bestPlacement = { row: newRow, col: newCol, dir };
            }
          }
        }
      }
    }

    // Kalau ada penempatan terbaik
    if (bestPlacement) {
      placeWordOnGrid(grid, word.answer, bestPlacement.row, bestPlacement.col, bestPlacement.dir);
      placements.push({
        answer: word.answer,
        clue: word.clue,
        row: bestPlacement.row,
        col: bestPlacement.col,
        dir: bestPlacement.dir
      });
    } else {
      // Fallback: taruh dekat cluster (cari tempat kosong terdekat dari center)
      let fallback = null;
      let fallbackDist = Infinity;

      for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
          for (const dir of ["across", "down"]) {
            const result = canPlaceWord(grid, word.answer, r, c, dir, SIZE);
            if (result.ok) {
              const dist = Math.abs(r - centerR) + Math.abs(c - centerC);
              if (dist < fallbackDist) {
                fallbackDist = dist;
                fallback = { row: r, col: c, dir };
              }
            }
          }
        }
      }

      if (fallback) {
        placeWordOnGrid(grid, word.answer, fallback.row, fallback.col, fallback.dir);
        placements.push({
          answer: word.answer,
          clue: word.clue,
          row: fallback.row,
          col: fallback.col,
          dir: fallback.dir
        });
      }
    }
  }

  // Hitung batas grid yang dipakai
  let minR = SIZE, maxR = 0, minC = SIZE, maxC = 0;
  placements.forEach(p => {
    const len = p.answer.length;
    for (let i = 0; i < len; i++) {
      const r = p.dir === "across" ? p.row : p.row + i;
      const c = p.dir === "across" ? p.col + i : p.col;
      minR = Math.min(minR, r); maxR = Math.max(maxR, r);
      minC = Math.min(minC, c); maxC = Math.max(maxC, c);
    }
  });

  // Geser ke kiri-atas
  placements.forEach(p => {
    p.row -= minR;
    p.col -= minC;
  });

  const rows = maxR - minR + 1;
  const cols = maxC - minC + 1;

  // Buat grid final
  const finalGrid = Array.from({ length: rows }, () =>
    Array.from({ length: cols }, () => null)
  );

  placements.forEach(p => {
    for (let i = 0; i < p.answer.length; i++) {
      const r = p.dir === "across" ? p.row : p.row + i;
      const c = p.dir === "across" ? p.col + i : p.col;
      if (!finalGrid[r][c]) {
        finalGrid[r][c] = { char: p.answer[i] };
      }
    }
  });

  // Beri nomor urut berdasarkan posisi baca
  // Kata yang mulai di sel yang sama dengan kata lain = nomor sama
  const numberedCells = new Map();
  const sortedByPos = [...placements].sort((a, b) => a.row - b.row || a.col - b.col);

  let currentNum = 0;
  const cellNumbers = new Map(); // key: "r,c" -> num

  sortedByPos.forEach(p => {
    const key = `${p.row},${p.col}`;
    if (!cellNumbers.has(key)) {
      currentNum++;
      cellNumbers.set(key, currentNum);
    }
    p.num = cellNumbers.get(key);
  });

  // Simpan nomor di grid
  finalGrid.forEach(row => row.forEach(cell => {
    if (cell) cell.num = null;
  }));
  placements.forEach(p => {
    const cell = finalGrid[p.row][p.col];
    if (cell) cell.num = p.num;
  });

  return { grid: finalGrid, placements, rows, cols };
}

/* ============================================================
   RENDER TABEL
============================================================ */
function buildTable(crossword, pageIdx) {
  const { grid, rows, cols } = crossword;
  let html = '<div class="crossword-scroll"><table class="crossword">';
  for (let r = 0; r < rows; r++) {
    html += '<tr>';
    for (let c = 0; c < cols; c++) {
      const cell = grid[r][c];
      if (!cell) {
        html += '<td class="block"></td>';
      } else {
        const num = cell.num ? cell.num : '';
        html += `<td class="cell" data-row="${r}" data-col="${c}">`;
        if (num) html += `<span class="num">${num}</span>`;
        html += `<input type="text" maxlength="1" data-row="${r}" data-col="${c}" data-answer="${cell.char}">`;
        html += '</td>';
      }
    }
    html += '</tr>';
  }
  html += '</table></div>';
  return html;
}

/* ============================================================
   RENDER PETUNJUK
============================================================ */
function buildClues(crossword, pageIdx) {
  const { placements } = crossword;
  const across = placements.filter(p => p.dir === "across").sort((a,b) => a.num - b.num);
  const down = placements.filter(p => p.dir === "down").sort((a,b) => a.num - b.num);

  let html = '<div class="clues">';
  html += '<h3>📝 الأسئلة</h3>';

  if (across.length > 0) {
    html += '<h4 class="across">➡️ أُفُقِيّ</h4>';
    across.forEach(w => {
      html += `<div class="clue-item" data-word-num="${w.num}" data-dir="across" data-page="${pageIdx+1}">
        <span class="clue-num across">${w.num}</span>
        <div class="clue-text">
          ${w.clue}
          <br>
          <button class="reveal-btn" data-page="${pageIdx+1}" data-num="${w.num}" data-dir="across">
            👁️ أظهر الحل
          </button>
        </div>
      </div>`;
    });
  }

  if (down.length > 0) {
    html += '<h4 class="down">⬇️ عَمُودِيّ</h4>';
    down.forEach(w => {
      html += `<div class="clue-item" data-word-num="${w.num}" data-dir="down" data-page="${pageIdx+1}">
        <span class="clue-num down">${w.num}</span>
        <div class="clue-text">
          ${w.clue}
          <br>
          <button class="reveal-btn" data-page="${pageIdx+1}" data-num="${w.num}" data-dir="down">
            👁️ أظهر الحل
          </button>
        </div>
      </div>`;
    });
  }

  html += '</div>';
  return html;
}

/* ============================================================
   BUILD CROSSWORDS
============================================================ */
const crosswords = ttsPages.map(p => buildCrossword(p.words));

/* ============================================================
   RENDER HALAMAN
============================================================ */
const pagesContainer = document.getElementById('pagesContainer');
const tabs = document.querySelectorAll('.page-tab');

function renderPages() {
  ttsPages.forEach((page, idx) => {
    const pageDiv = document.createElement('div');
    pageDiv.className = 'page-content' + (idx === 0 ? ' active' : '');
    pageDiv.id = 'page-' + (idx + 1);

    const cw = crosswords[idx];
    const wordCount = cw.placements.length;

    pageDiv.innerHTML = `
      <div class="page-title">${page.title}</div>
      <div class="page-subtitle">${page.subtitle}</div>

      <div class="info-panel">
        <span class="stat">📝 ${wordCount} كلمات</span>
        <span class="stat">📐 ${cw.rows} × ${cw.cols}</span>
      </div>

      <div class="tts-wrapper">
        <div class="grid-box" data-page="${idx+1}">
          <div class="zoom-controls">
            <button class="zoom-btn" data-zoom="out" data-page="${idx+1}">−</button>
            <span class="zoom-level" id="zoomLevel-${idx+1}">100%</span>
            <button class="zoom-btn" data-zoom="in" data-page="${idx+1}">+</button>
            <button class="zoom-btn" data-zoom="fit" data-page="${idx+1}" title="ملء الشاشة">⛶</button>
          </div>
          ${buildTable(cw, idx)}
        </div>
        ${buildClues(cw, idx)}
      </div>

      <div class="action-row">
        <button class="btn btn-check" data-page="${idx+1}">✅ تحقق من الإجابة</button>
        <button class="btn btn-reset" data-page="${idx+1}">🔄 مسح</button>
      </div>
      <div class="feedback-msg" id="feedback-${idx+1}"></div>
    `;

    pagesContainer.appendChild(pageDiv);
  });
}

/* ============================================================
   ZOOM CONTROLS
============================================================ */
const zoomLevels = {}; // { pageNum: cellSize }

function updateCellSize(pageNum, size) {
  zoomLevels[pageNum] = size;
  const gridBox = document.querySelector(`.grid-box[data-page="${pageNum}"]`);
  if (gridBox) {
    gridBox.style.setProperty('--cell-size', size + 'px');
  }
  const levelEl = document.getElementById('zoomLevel-' + pageNum);
  if (levelEl) {
    const percent = Math.round((size / 55) * 100);
    levelEl.textContent = percent + '%';
  }
}

function autoFitPage(pageNum) {
  const gridBox = document.querySelector(`.grid-box[data-page="${pageNum}"]`);
  if (!gridBox) return;
  const table = gridBox.querySelector('table.crossword');
  if (!table) return;

  const cw = crosswords[parseInt(pageNum) - 1];
  const availableW = gridBox.clientWidth - 40;
  const availableH = gridBox.clientHeight - 40;

  const cellW = Math.floor(availableW / cw.cols);
  const cellH = Math.floor(availableH / cw.rows);
  let cellSize = Math.min(cellW, cellH, 80);
  cellSize = Math.max(cellSize, 30);

  updateCellSize(pageNum, cellSize);
}

/* ============================================================
   INTERAKSI TAB
============================================================ */
tabs.forEach(tab => {
  tab.addEventListener('click', () => {
    tabs.forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    document.querySelectorAll('.page-content').forEach(p => p.classList.remove('active'));
    document.getElementById('page-' + tab.dataset.page).classList.add('active');

    // Auto-fit saat pindah tab
    setTimeout(() => autoFitPage(tab.dataset.page), 100);
  });
});

/* ============================================================
   AUTO-FOCUS INPUT
============================================================ */
document.addEventListener('input', (e) => {
  if (e.target.tagName !== 'INPUT') return;
  if (!e.target.value) return;
  const r = parseInt(e.target.dataset.row);
  const c = parseInt(e.target.dataset.col);
  const pageNum = getCurrentPage();

  const candidates = [
    { r: r, c: c - 1 },
    { r: r, c: c + 1 },
    { r: r + 1, c: c },
    { r: r - 1, c: c }
  ];

  for (const cand of candidates) {
    const next = document.querySelector(
      `#page-${pageNum} td.cell[data-row="${cand.r}"][data-col="${cand.c}"] input`
    );
    if (next && !next.value) { next.focus(); return; }
  }
});

document.addEventListener('keydown', (e) => {
  if (e.key !== 'Backspace') return;
  if (e.target.tagName !== 'INPUT') return;
  if (e.target.value !== '') return;

  const r = parseInt(e.target.dataset.row);
  const c = parseInt(e.target.dataset.col);
  const pageNum = getCurrentPage();

  const candidates = [
    { r: r, c: c + 1 },
    { r: r, c: c - 1 },
    { r: r - 1, c: c },
    { r: r + 1, c: c }
  ];

  for (const cand of candidates) {
    const prev = document.querySelector(
      `#page-${pageNum} td.cell[data-row="${cand.r}"][data-col="${cand.c}"] input`
    );
    if (prev) { prev.focus(); prev.value = ''; return; }
  }
});

function getCurrentPage() {
  const active = document.querySelector('.page-tab.active');
  return active ? active.dataset.page : '1';
}

/* ============================================================
   CHECK / RESET / REVEAL
============================================================ */
document.addEventListener('click', (e) => {
  if (e.target.classList.contains('btn-check')) {
    checkPage(e.target.dataset.page);
  }
  if (e.target.classList.contains('btn-reset')) {
    resetPage(e.target.dataset.page);
  }
  if (e.target.classList.contains('reveal-btn')) {
    revealOne(e.target);
  }
  if (e.target.classList.contains('zoom-btn')) {
    handleZoom(e.target);
  }
});

function handleZoom(btn) {
  const pageNum = btn.dataset.page;
  const action = btn.dataset.zoom;
  const current = zoomLevels[pageNum] || 55;

  if (action === 'in') {
    updateCellSize(pageNum, Math.min(current + 8, 100));
  } else if (action === 'out') {
    updateCellSize(pageNum, Math.max(current - 8, 20));
  } else if (action === 'fit') {
    autoFitPage(pageNum);
  }
}

function checkPage(pageNum) {
  let allCorrect = true;
  let filledCount = 0;
  let correctCount = 0;
  let totalCells = 0;

  document.querySelectorAll(`#page-${pageNum} td.cell`).forEach(td => {
    const input = td.querySelector('input');
    if (!input) return;
    totalCells++;
    td.classList.remove('correct', 'wrong');
    const correctChar = input.dataset.answer;
    const val = input.value.trim();
    if (val) {
      filledCount++;
      if (val === correctChar) {
        td.classList.add('correct');
        correctCount++;
      } else {
        td.classList.add('wrong');
        allCorrect = false;
      }
    } else {
      allCorrect = false;
    }
  });

  const fb = document.getElementById('feedback-' + pageNum);
  if (allCorrect && filledCount > 0) {
    fb.textContent = '🎉 مُمْتَاز! جَمِيعُ الإِجَابَاتِ صَحِيحَة';
    fb.className = 'feedback-msg ok';
  } else {
    fb.textContent = `📊 الإِجَابَاتُ الصَّحِيحَة: ${correctCount} / ${totalCells}`;
    fb.className = 'feedback-msg no';
  }
}

function revealOne(btn) {
  const pageNum = btn.dataset.page;
  const num = parseInt(btn.dataset.num);
  const dir = btn.dataset.dir;

  const crossword = crosswords[parseInt(pageNum) - 1];
  const word = crossword.placements.find(p => p.num === num && p.dir === dir);
  if (!word) return;

  for (let i = 0; i < word.answer.length; i++) {
    const r = word.dir === "across" ? word.row : word.row + i;
    const c = word.dir === "across" ? word.col + i : word.col;
    const input = document.querySelector(
      `#page-${pageNum} td.cell[data-row="${r}"][data-col="${c}"] input`
    );
    if (input) {
      input.value = word.answer[i];
      input.parentElement.classList.remove('wrong', 'correct');
      input.parentElement.classList.add('revealed');
    }
  }

  btn.disabled = true;
  btn.textContent = '✅ تم الإظهار';
}

function resetPage(pageNum) {
  document.querySelectorAll(`#page-${pageNum} td.cell input`).forEach(input => {
    input.value = '';
    input.parentElement.classList.remove('correct', 'wrong', 'revealed');
  });
  document.querySelectorAll(`#page-${pageNum} .reveal-btn`).forEach(btn => {
    btn.disabled = false;
    btn.textContent = '👁️ أظهر الحل';
  });
  const fb = document.getElementById('feedback-' + pageNum);
  fb.textContent = '';
  fb.className = 'feedback-msg';
}

/* ============================================================
   INIT
============================================================ */
renderPages();

// Auto-fit semua halaman setelah render
setTimeout(() => {
  ttsPages.forEach((_, idx) => {
    autoFitPage(idx + 1);
  });
}, 200);

// Re-fit saat window resize
let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    autoFitPage(getCurrentPage());
  }, 200);
});
</script>
</body>
</html>
