<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اختبار المفردات - العربية بين يديك</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap');

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Tajawal', sans-serif;
  }

  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    position: relative;
  }

  /* ===== Robot Intro ===== */
  #robot-screen {
    position: fixed;
    inset: 0;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 1000;
    transition: opacity 0.8s ease, visibility 0.8s;
  }

  #robot-screen.hide {
    opacity: 0;
    visibility: hidden;
  }

  .robot {
    position: relative;
    width: 140px;
    height: 180px;
    animation: robotFloat 2s ease-in-out infinite;
  }

  @keyframes robotFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-20px); }
  }

  .robot-head {
    width: 100px;
    height: 90px;
    background: linear-gradient(145deg, #00d2ff, #3a7bd5);
    border-radius: 50px 50px 40px 40px;
    margin: 0 auto;
    position: relative;
    box-shadow: 0 0 30px rgba(0, 210, 255, 0.5);
  }

  .robot-eye {
    width: 22px;
    height: 22px;
    background: #fff;
    border-radius: 50%;
    position: absolute;
    top: 30px;
    animation: blink 3s infinite;
  }

  .robot-eye.left { left: 18px; }
  .robot-eye.right { right: 18px; }

  .robot-eye::after {
    content: '';
    width: 10px;
    height: 10px;
    background: #0f0c29;
    border-radius: 50%;
    position: absolute;
    top: 6px;
    left: 6px;
  }

  @keyframes blink {
    0%, 90%, 100% { transform: scaleY(1); }
    95% { transform: scaleY(0.1); }
  }

  .robot-mouth {
    width: 40px;
    height: 8px;
    background: #0f0c29;
    border-radius: 4px;
    position: absolute;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%);
  }

  .robot-antenna {
    width: 6px;
    height: 40px;
    background: #00d2ff;
    position: absolute;
    top: -35px;
    left: 50%;
    transform: translateX(-50%);
    border-radius: 3px;
  }

  .robot-antenna::after {
    content: '';
    width: 16px;
    height: 16px;
    background: #ff6b6b;
    border-radius: 50%;
    position: absolute;
    top: -12px;
    left: 50%;
    transform: translateX(-50%);
    animation: pulse 1s infinite;
  }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255, 107, 107, 0.7); }
    50% { box-shadow: 0 0 0 12px rgba(255, 107, 107, 0); }
  }

  .robot-body {
    width: 90px;
    height: 70px;
    background: linear-gradient(145deg, #3a7bd5, #00d2ff);
    border-radius: 20px;
    margin: 10px auto 0;
    position: relative;
    box-shadow: 0 0 20px rgba(0, 210, 255, 0.3);
  }

  .robot-arm {
    width: 20px;
    height: 50px;
    background: #3a7bd5;
    border-radius: 10px;
    position: absolute;
    top: 5px;
  }

  .robot-arm.left {
    left: -25px;
    animation: waveLeft 1.5s ease-in-out infinite;
  }

  .robot-arm.right {
    right: -25px;
    animation: waveRight 1.5s ease-in-out infinite;
  }

  @keyframes waveLeft {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(30deg); }
  }

  @keyframes waveRight {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(-30deg); }
  }

  .robot-title {
    color: #00d2ff;
    font-size: 1.8rem;
    font-weight: 800;
    margin-top: 30px;
    text-align: center;
    animation: glowText 2s ease-in-out infinite;
  }

  @keyframes glowText {
    0%, 100% { text-shadow: 0 0 10px rgba(0, 210, 255, 0.5); }
    50% { text-shadow: 0 0 30px rgba(0, 210, 255, 1), 0 0 60px rgba(0, 210, 255, 0.5); }
  }

  .robot-sub {
    color: #a0a0c0;
    font-size: 1.1rem;
    margin-top: 10px;
    text-align: center;
  }

  .loading-bar {
    width: 250px;
    height: 6px;
    background: rgba(255,255,255,0.1);
    border-radius: 3px;
    margin-top: 30px;
    overflow: hidden;
  }

  .loading-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #00d2ff, #3a7bd5);
    border-radius: 3px;
    animation: loadBar 3.5s ease forwards;
  }

  @keyframes loadBar {
    to { width: 100%; }
  }

  /* ===== Quiz Container ===== */
  #quiz-container {
    width: 100%;
    max-width: 750px;
    margin: 20px;
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(20px);
    border-radius: 24px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
    padding: 30px;
    opacity: 0;
    transform: translateY(30px);
    transition: all 0.6s ease;
    position: relative;
    z-index: 1;
  }

  #quiz-container.show {
    opacity: 1;
    transform: translateY(0);
  }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    flex-wrap: wrap;
    gap: 10px;
  }

  .header h1 {
    color: #00d2ff;
    font-size: 1.3rem;
    font-weight: 700;
  }

  .stats {
    display: flex;
    gap: 15px;
  }

  .stat-box {
    background: rgba(0, 210, 255, 0.1);
    border: 1px solid rgba(0, 210, 255, 0.3);
    border-radius: 12px;
    padding: 6px 14px;
    color: #00d2ff;
    font-weight: 600;
    font-size: 0.9rem;
  }

  .progress-bar {
    width: 100%;
    height: 8px;
    background: rgba(255,255,255,0.08);
    border-radius: 4px;
    margin-bottom: 25px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #00d2ff, #3a7bd5);
    border-radius: 4px;
    transition: width 0.4s ease;
  }

  .timer-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }

  .timer-circle {
    width: 55px;
    height: 55px;
    border-radius: 50%;
    background: conic-gradient(#00d2ff 0deg, rgba(255,255,255,0.1) 0deg);
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    transition: background 0.3s;
  }

  .timer-circle::before {
    content: '';
    width: 42px;
    height: 42px;
    background: #1a1a2e;
    border-radius: 50%;
    position: absolute;
  }

  .timer-text {
    position: relative;
    z-index: 1;
    color: #fff;
    font-weight: 700;
    font-size: 1.1rem;
  }

  .question-type {
    color: #a0a0c0;
    font-size: 0.95rem;
    background: rgba(255,255,255,0.05);
    padding: 6px 16px;
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.1);
  }

  .question-text {
    color: #fff;
    font-size: 1.5rem;
    font-weight: 700;
    margin-bottom: 25px;
    line-height: 1.6;
    text-align: center;
    min-height: 60px;
  }

  .options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin-bottom: 25px;
  }

  @media (max-width: 550px) {
    .options { grid-template-columns: 1fr; }
    .question-text { font-size: 1.2rem; }
  }

  .option {
    background: rgba(255, 255, 255, 0.06);
    border: 2px solid rgba(255, 255, 255, 0.1);
    border-radius: 16px;
    padding: 18px 20px;
    color: #e0e0f0;
    font-size: 1.15rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.3s ease;
    text-align: right;
    position: relative;
    overflow: hidden;
  }

  .option:hover:not(.disabled) {
    background: rgba(0, 210, 255, 0.15);
    border-color: #00d2ff;
    transform: translateY(-3px);
    box-shadow: 0 10px 25px rgba(0, 210, 255, 0.2);
  }

  .option.correct {
    background: rgba(46, 213, 115, 0.2);
    border-color: #2ed573;
    color: #2ed573;
    animation: correctPulse 0.5s ease;
  }

  .option.wrong {
    background: rgba(255, 71, 87, 0.2);
    border-color: #ff4757;
    color: #ff4757;
    animation: wrongShake 0.5s ease;
  }

  .option.disabled {
    cursor: not-allowed;
    opacity: 0.6;
  }

  @keyframes correctPulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.05); }
    100% { transform: scale(1); }
  }

  @keyframes wrongShake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-8px); }
    75% { transform: translateX(8px); }
  }

  .option .letter {
    display: inline-block;
    width: 30px;
    height: 30px;
    line-height: 30px;
    text-align: center;
    background: rgba(0, 210, 255, 0.2);
    border-radius: 8px;
    margin-left: 10px;
    font-weight: 700;
    color: #00d2ff;
    font-size: 0.9rem;
  }

  .option.correct .letter {
    background: rgba(46, 213, 115, 0.3);
    color: #2ed573;
  }

  .option.wrong .letter {
    background: rgba(255, 71, 87, 0.3);
    color: #ff4757;
  }

  .nav-buttons {
    display: flex;
    justify-content: space-between;
    gap: 12px;
  }

  .nav-btn {
    flex: 1;
    padding: 14px 20px;
    border: none;
    border-radius: 14px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.3s ease;
    font-family: 'Tajawal', sans-serif;
  }

  .nav-btn.prev {
    background: rgba(255, 255, 255, 0.08);
    color: #a0a0c0;
    border: 1px solid rgba(255, 255, 255, 0.15);
  }

  .nav-btn.prev:hover:not(:disabled) {
    background: rgba(255, 255, 255, 0.15);
    color: #fff;
  }

  .nav-btn.next {
    background: linear-gradient(135deg, #00d2ff, #3a7bd5);
    color: #fff;
    box-shadow: 0 6px 20px rgba(0, 210, 255, 0.3);
  }

  .nav-btn.next:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 10px 30px rgba(0, 210, 255, 0.5);
  }

  .nav-btn:disabled {
    opacity: 0.3;
    cursor: not-allowed;
  }

  /* ===== Result Screen ===== */
  #result-screen {
    display: none;
    text-align: center;
    padding: 20px;
  }

  #result-screen.show {
    display: block;
    animation: fadeIn 0.6s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: scale(0.9); }
    to { opacity: 1; transform: scale(1); }
  }

  .result-icon {
    font-size: 5rem;
    margin-bottom: 15px;
    animation: bounceIn 0.8s ease;
  }

  @keyframes bounceIn {
    0% { transform: scale(0); }
    50% { transform: scale(1.2); }
    100% { transform: scale(1); }
  }

  .result-title {
    color: #00d2ff;
    font-size: 2rem;
    font-weight: 800;
    margin-bottom: 10px;
  }

  .result-score {
    color: #fff;
    font-size: 3.5rem;
    font-weight: 800;
    margin: 15px 0;
  }

  .result-detail {
    color: #a0a0c0;
    font-size: 1.1rem;
    margin-bottom: 25px;
  }

  .restart-btn {
    padding: 16px 40px;
    background: linear-gradient(135deg, #00d2ff, #3a7bd5);
    color: #fff;
    border: none;
    border-radius: 50px;
    font-size: 1.2rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.3s ease;
    font-family: 'Tajawal', sans-serif;
    box-shadow: 0 8px 25px rgba(0, 210, 255, 0.4);
  }

  .restart-btn:hover {
    transform: translateY(-3px) scale(1.05);
    box-shadow: 0 12px 35px rgba(0, 210, 255, 0.6);
  }

  .feedback {
    text-align: center;
    font-size: 1.1rem;
    font-weight: 700;
    min-height: 30px;
    margin-bottom: 10px;
    transition: all 0.3s;
  }

  .feedback.correct { color: #2ed573; }
  .feedback.wrong { color: #ff4757; }

  /* ===== Answer Key Screen ===== */
  #answer-key-screen {
    display: none;
    position: fixed;
    inset: 0;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    z-index: 999;
    overflow-y: auto;
    padding: 30px 20px;
  }

  #answer-key-screen.show {
    display: block;
    animation: fadeIn 0.6s ease;
  }

  .answer-key-container {
    max-width: 800px;
    margin: 0 auto;
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(20px);
    border-radius: 24px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    padding: 30px;
  }

  .answer-key-title {
    color: #00d2ff;
    font-size: 1.8rem;
    font-weight: 800;
    text-align: center;
    margin-bottom: 10px;
  }

  .answer-key-sub {
    color: #a0a0c0;
    text-align: center;
    margin-bottom: 25px;
    font-size: 1rem;
  }

  .answer-item {
    background: rgba(255, 255, 255, 0.04);
    border-right: 4px solid #00d2ff;
    border-radius: 10px;
    padding: 14px 18px;
    margin-bottom: 12px;
  }

  .answer-num {
    display: inline-block;
    width: 32px;
    height: 32px;
    line-height: 32px;
    text-align: center;
    background: rgba(0, 210, 255, 0.2);
    color: #00d2ff;
    border-radius: 8px;
    font-weight: 700;
    font-size: 0.9rem;
    margin-left: 10px;
  }

  .answer-q {
    color: #fff;
    font-weight: 600;
    font-size: 1rem;
    display: inline;
  }

  .answer-correct {
    color: #2ed573;
    font-weight: 700;
    font-size: 1rem;
    display: block;
    margin-top: 6px;
    padding-right: 42px;
  }

  .answer-correct::before {
    content: '✅ الجواب: ';
    color: #a0a0c0;
    font-weight: 500;
  }

  .answer-key-btn {
    display: block;
    margin: 25px auto 0;
    padding: 16px 40px;
    background: linear-gradient(135deg, #00d2ff, #3a7bd5);
    color: #fff;
    border: none;
    border-radius: 50px;
    font-size: 1.1rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.3s ease;
    font-family: 'Tajawal', sans-serif;
    box-shadow: 0 8px 25px rgba(0, 210, 255, 0.4);
  }

  .answer-key-btn:hover {
    transform: translateY(-3px) scale(1.05);
    box-shadow: 0 12px 35px rgba(0, 210, 255, 0.6);
  }
</style>
</head>
<body>

<!-- Robot Intro Screen -->
<div id="robot-screen">
  <div class="robot">
    <div class="robot-antenna"></div>
    <div class="robot-head">
      <div class="robot-eye left"></div>
      <div class="robot-eye right"></div>
      <div class="robot-mouth"></div>
    </div>
    <div class="robot-body">
      <div class="robot-arm left"></div>
      <div class="robot-arm right"></div>
    </div>
  </div>
  <div class="robot-title">اختبار المفردات</div>
  <div class="robot-sub">العربية بين يديك — الوحدات ١ إلى ١٤</div>
  <div class="loading-bar"><div class="loading-fill"></div></div>
</div>

<!-- Quiz Container -->
<div id="quiz-container">
  <div class="header">
    <h1>📚 اختبار المفردات</h1>
    <div class="stats">
      <div class="stat-box" id="scoreDisplay">النقاط: ٠</div>
      <div class="stat-box" id="questionCounter">١ / ٥٠</div>
    </div>
  </div>

  <div class="progress-bar">
    <div class="progress-fill" id="progressFill" style="width: 0%"></div>
  </div>

  <div class="timer-row">
    <div class="timer-circle" id="timerCircle">
      <span class="timer-text" id="timerText">١٥</span>
    </div>
    <div class="question-type" id="questionType">ما المعنى؟</div>
  </div>

  <div class="question-text" id="questionText">جار التحميل...</div>

  <div class="options" id="optionsContainer"></div>

  <div class="feedback" id="feedback"></div>

  <div class="nav-buttons">
    <button class="nav-btn prev" id="prevBtn" disabled>◀ السابق</button>
    <button class="nav-btn next" id="nextBtn">التالي ▶</button>
  </div>
</div>

<!-- Result Screen -->
<div id="result-screen" style="position:fixed; inset:0; background:linear-gradient(135deg,#0f0c29,#302b63,#24243e); z-index:999; overflow-y:auto; padding:40px 20px;">
  <div style="max-width:600px; margin:0 auto;">
    <div class="result-icon" id="resultIcon">🏆</div>
    <div class="result-title" id="resultTitle">أحسنت!</div>
    <div class="result-score" id="resultScore">٠ / ٥٠</div>
    <div class="result-detail" id="resultDetail">النسبة: ٠٪</div>
    <button class="restart-btn" id="restartBtn">🔄 إعادة الاختبار</button>
    <button class="restart-btn" id="showAnswerKeyBtn" style="margin-top:12px; background:linear-gradient(135deg,#2ed573,#1e9e54);">📖 عرض مفتاح الإجابات</button>
  </div>
</div>

<!-- Answer Key Screen -->
<div id="answer-key-screen">
  <div class="answer-key-container">
    <div class="answer-key-title">📖 مفتاح الإجابات الصحيحة</div>
    <div class="answer-key-sub">جميع الأسئلة مع الجواب الصحيح</div>
    <div id="answerKeyList"></div>
    <button class="answer-key-btn" id="backToResultBtn">◀ العودة إلى النتيجة</button>
  </div>
</div>

<script>
// ===== Bank Soal dari Wahdah 1-14 (Bab Haj) =====
const questionBank = [
  // ===== الوحدة 1 =====
  { q: "ما معنى كلمة «التَّحِيَّة»؟", type: "ما المعنى؟", options: ["السَّلَام", "التَّعَارُف", "الِاسْم", "الْحَال"], correct: 0 },
  { q: "ما مرادف كلمة «الْحَال»؟", type: "ما المرادف؟", options: ["شَأْنٌ", "اسْمٌ", "أَخٌ", "مُدَرِّسٌ"], correct: 0 },
  { q: "ما جمع كلمة «اسْم»؟", type: "ما الجمع؟", options: ["أَسْمَاء", "أَحْوَال", "إِخْوَة", "مُدَرِّسُون"], correct: 0 },
  { q: "ما ضد كلمة «أَخٌ»؟", type: "ما الضد؟", options: ["أُخْتٌ", "أَبٌ", "جَدٌّ", "عَمٌّ"], correct: 0 },
  { q: "ما معنى كلمة «مُدَرِّس»؟", type: "ما المعنى؟", options: ["مُعَلِّم", "طَالِب", "طَبِيب", "مُهَنْدِس"], correct: 0 },
  { q: "ما مرادف كلمة «صَدِيق»؟", type: "ما المرادف؟", options: ["صَاحِب", "عَدُوّ", "أَخ", "جَار"], correct: 0 },
  { q: "ما جمع كلمة «طَبِيب»؟", type: "ما الجمع؟", options: ["أَطِبَّاء", "طُلَّاب", "مُدَرِّسُون", "مُهَنْدِسُون"], correct: 0 },
  { q: "ما معنى كلمة «أَهْلًا وَسَهْلًا»؟", type: "ما المعنى؟", options: ["عِبَارَة اسْتِقْبَال", "عِبَارَة وَدَاع", "عِبَارَة شُكْر", "عِبَارَة اعْتِذَار"], correct: 0 },

  // ===== الوحدة 2 =====
  { q: "ما معنى كلمة «صُورَة»؟", type: "ما المعنى؟", options: ["رَسْم", "كِتَاب", "بَاب", "قَلَم"], correct: 0 },
  { q: "ما مرادف كلمة «أُسْرَة»؟", type: "ما المرادف؟", options: ["عَائِلَة", "بَيْت", "غُرْفَة", "مَدْرَسَة"], correct: 0 },

// ===== Shuffle Options (agar jawaban benar acak posisinya) =====
function shuffleArray(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// Acak opsi & tentukan ulang index correct
questionBank.forEach(item => {
  const correctText = item.options[item.correct];
  const shuffled = shuffleArray(item.options);
  item.options = shuffled;
  item.correct = shuffled.indexOf(correctText);
});

// ===== State =====
let currentQuestion = 0;
let score = 0;
let timerInterval = null;
let timeLeft = 15;
let answered = false;
let userAnswers = new Array(questionBank.length).fill(null);

// ===== DOM Elements =====
const robotScreen = document.getElementById('robot-screen');
const quizContainer = document.getElementById('quiz-container');
const questionText = document.getElementById('questionText');
const questionType = document.getElementById('questionType');
const optionsContainer = document.getElementById('optionsContainer');
const questionCounter = document.getElementById('questionCounter');
const scoreDisplay = document.getElementById('scoreDisplay');
const progressFill = document.getElementById('progressFill');
const timerCircle = document.getElementById('timerCircle');
const timerText = document.getElementById('timerText');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const feedback = document.getElementById('feedback');
const resultScreen = document.getElementById('result-screen');
const resultIcon = document.getElementById('resultIcon');
const resultTitle = document.getElementById('resultTitle');
const resultScore = document.getElementById('resultScore');
const resultDetail = document.getElementById('resultDetail');
const restartBtn = document.getElementById('restartBtn');
const showAnswerKeyBtn = document.getElementById('showAnswerKeyBtn');
const answerKeyScreen = document.getElementById('answer-key-screen');
const answerKeyList = document.getElementById('answerKeyList');
const backToResultBtn = document.getElementById('backToResultBtn');

// ===== Robot Intro =====
setTimeout(() => {
  robotScreen.classList.add('hide');
  quizContainer.classList.add('show');
  startQuiz();
}, 3800);

// ===== Quiz Functions =====
function startQuiz() {
  currentQuestion = 0;
  score = 0;
  userAnswers = new Array(questionBank.length).fill(null);
  answered = false;
  resultScreen.style.display = 'none';
  resultScreen.classList.remove('show');
  answerKeyScreen.classList.remove('show');
  quizContainer.style.display = 'block';
  quizContainer.classList.add('show');
  renderQuestion();
}

function renderQuestion() {
  clearInterval(timerInterval);
  answered = false;
  feedback.textContent = '';
  feedback.className = 'feedback';

  const q = questionBank[currentQuestion];
  questionText.textContent = q.q;
  questionType.textContent = q.type;

  questionCounter.textContent = `${toArabic(currentQuestion + 1)} / ${toArabic(questionBank.length)}`;
  scoreDisplay.textContent = `النقاط: ${toArabic(score)}`;
  progressFill.style.width = `${((currentQuestion) / questionBank.length) * 100}%`;

  optionsContainer.innerHTML = '';
  const letters = ['أ', 'ب', 'ج', 'د'];
  q.options.forEach((opt, idx) => {
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.innerHTML = `<span class="letter">${letters[idx]}</span>${opt}`;
    btn.dataset.index = idx;
    btn.addEventListener('click', () => selectAnswer(idx));
    optionsContainer.appendChild(btn);
  });

  if (userAnswers[currentQuestion] !== null) {
    const prevAnswer = userAnswers[currentQuestion];
    const options = document.querySelectorAll('.option');
    options.forEach((opt, idx) => {
      if (idx === prevAnswer) {
        opt.classList.add(prevAnswer === q.correct ? 'correct' : 'wrong');
      }
      opt.classList.add('disabled');
    });
    if (prevAnswer === q.correct) {
      feedback.textContent = '✅ صحيح!';
      feedback.className = 'feedback correct';
    } else {
      feedback.textContent = `❌ خطأ! الجواب الصحيح: ${q.options[q.correct]}`;
      feedback.className = 'feedback wrong';
    }
    answered = true;
  } else {
    document.querySelectorAll('.option').forEach(opt => opt.classList.remove('disabled', 'correct', 'wrong'));
    startTimer();
  }

  prevBtn.disabled = currentQuestion === 0;
  nextBtn.textContent = currentQuestion === questionBank.length - 1 ? 'إنهاء الاختبار 🏁' : 'التالي ▶';
  updateNavButtons();

  progressFill.style.width = `${((currentQuestion + 1) / questionBank.length) * 100}%`;
}

function selectAnswer(index) {
  if (answered) return;
  clearInterval(timerInterval);
  answered = true;

  const q = questionBank[currentQuestion];
  const isCorrect = index === q.correct;
  userAnswers[currentQuestion] = index;

  if (isCorrect) {
    score++;
    scoreDisplay.textContent = `النقاط: ${toArabic(score)}`;
    feedback.textContent = '✅ صحيح!';
    feedback.className = 'feedback correct';
  } else {
    feedback.textContent = `❌ خطأ! الجواب الصحيح: ${q.options[q.correct]}`;
    feedback.className = 'feedback wrong';
  }

  const options = document.querySelectorAll('.option');
  options.forEach((opt, idx) => {
    opt.classList.add('disabled');
    if (idx === q.correct) opt.classList.add('correct');
    if (idx === index && !isCorrect) opt.classList.add('wrong');
  });

  updateNavButtons();
}

function startTimer() {
  timeLeft = 15;
  updateTimerDisplay();
  timerInterval = setInterval(() => {
    timeLeft--;
    updateTimerDisplay();
    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      if (!answered) {
        answered = true;
        userAnswers[currentQuestion] = -1;
        const q = questionBank[currentQuestion];
        feedback.textContent = `⏰ انتهى الوقت! الجواب الصحيح: ${q.options[q.correct]}`;
        feedback.className = 'feedback wrong';
        const options = document.querySelectorAll('.option');
        options.forEach((opt, idx) => {
          opt.classList.add('disabled');
          if (idx === q.correct) opt.classList.add('correct');
        });
        updateNavButtons();
      }
    }
  }, 1000);
}

function updateTimerDisplay() {
  timerText.textContent = toArabic(timeLeft);
  const degrees = (timeLeft / 15) * 360;
  const color = timeLeft > 10 ? '#2ed573' : timeLeft > 5 ? '#ffa502' : '#ff4757';
  timerCircle.style.background = `conic-gradient(${color} ${degrees}deg, rgba(255,255,255,0.1) ${degrees}deg)`;
  timerText.style.color = color;
}

function updateNavButtons() {
  prevBtn.disabled = currentQuestion === 0;
  nextBtn.disabled = false;
}

function nextQuestion() {
  clearInterval(timerInterval);
  if (currentQuestion < questionBank.length - 1) {
    currentQuestion++;
    renderQuestion();
  } else {
    showResult();
  }
}

function prevQuestion() {
  clearInterval(timerInterval);
  if (currentQuestion > 0) {
    currentQuestion--;
    renderQuestion();
  }
}

function showResult() {
  clearInterval(timerInterval);
  quizContainer.style.display = 'none';
  resultScreen.style.display = 'block';
  resultScreen.classList.add('show');

  const total = questionBank.length;
  const percentage = Math.round((score / total) * 100);

  resultScore.textContent = `${toArabic(score)} / ${toArabic(total)}`;
  resultDetail.textContent = `النسبة: ${toArabic(percentage)}٪`;

  if (percentage >= 90) {
    resultIcon.textContent = '🏆';
    resultTitle.textContent = 'ممتاز! ما شاء الله';
  } else if (percentage >= 70) {
    resultIcon.textContent = '🌟';
    resultTitle.textContent = 'جيد جدًا! أحسنت';
  } else if (percentage >= 50) {
    resultIcon.textContent = '📖';
    resultTitle.textContent = 'جيد! واصل التعلم';
  } else {
    resultIcon.textContent = '💪';
    resultTitle.textContent = 'لا بأس! حاول مرة أخرى';
  }

  // Bangun kunci jawaban
  buildAnswerKey();
}

function buildAnswerKey() {
  answerKeyList.innerHTML = '';
  questionBank.forEach((item, idx) => {
    const div = document.createElement('div');
    div.className = 'answer-item';
    div.innerHTML = `
      <span class="answer-num">${toArabic(idx + 1)}</span>
      <span class="answer-q">${item.q}</span>
      <span class="answer-correct">${item.options[item.correct]}</span>
    `;
    answerKeyList.appendChild(div);
  });
}

function showAnswerKey() {
  resultScreen.style.display = 'none';
  resultScreen.classList.remove('show');
  answerKeyScreen.classList.add('show');
  answerKeyScreen.scrollTop = 0;
}

function backToResult() {
  answerKeyScreen.classList.remove('show');
  resultScreen.style.display = 'block';
  resultScreen.classList.add('show');
}

// ===== Helpers =====
function toArabic(num) {
  const arabicDigits = ['٠', '١', '٢', '٣', '٤', '٥', '٦', '٧', '٨', '٩'];
  return String(num).split('').map(d => arabicDigits[parseInt(d)] || d).join('');
}

// ===== Event Listeners =====
nextBtn.addEventListener('click', nextQuestion);
prevBtn.addEventListener('click', prevQuestion);
restartBtn.addEventListener('click', startQuiz);
showAnswerKeyBtn.addEventListener('click', showAnswerKey);
backToResultBtn.addEventListener('click', backToResult);

document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft') nextQuestion();
  if (e.key === 'ArrowRight') prevQuestion();
});
</script>
