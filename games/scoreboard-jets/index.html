<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لَوْحَةُ النِّقَاط — Papan Skor Jet</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Amiri:wght@400;700&display=swap');

  * { margin:0; padding:0; box-sizing:border-box; font-family:'Tajawal',sans-serif; }

  :root {
    --primary:#00d2ff;
    --primary-dark:#3a7bd5;
    --gold:#FFD700;
    --gold-dark:#FFA500;
    --success:#2ed573;
    --danger:#ff4757;
    --dark:#0f0c29;
    --dark-2:#302b63;
    --dark-3:#24243e;
    --text:#fff;
    --text-muted:#a0a0c0;
  }

  body {
    min-height:100vh;
    background:linear-gradient(180deg, #1a1a3e 0%, #2a2a5e 40%, #4a4a8e 100%);
    color:var(--text);
    overflow-x:hidden;
    position:relative;
  }

  /* ===== Sky Background ===== */
  .sky-bg {
    position:fixed;
    inset:0;
    z-index:0;
    overflow:hidden;
    background:linear-gradient(180deg, #0f0c29 0%, #302b63 30%, #4a5a9e 70%, #6a7ac0 100%);
  }

  /* Bintang */
  .stars {
    position:absolute;
    inset:0;
    background-image:
      radial-gradient(2px 2px at 20% 30%, white, transparent),
      radial-gradient(1px 1px at 60% 70%, white, transparent),
      radial-gradient(1px 1px at 50% 20%, white, transparent),
      radial-gradient(2px 2px at 80% 50%, rgba(255,255,255,0.8), transparent),
      radial-gradient(1px 1px at 30% 80%, white, transparent),
      radial-gradient(1px 1px at 90% 10%, white, transparent),
      radial-gradient(2px 2px at 15% 60%, white, transparent),
      radial-gradient(1px 1px at 70% 40%, rgba(255,255,255,0.6), transparent);
    animation:twinkle 4s ease-in-out infinite alternate;
  }
  @keyframes twinkle {
    0% { opacity:0.5; }
    100% { opacity:1; }
  }

  /* Bulan */
  .moon {
    position:absolute;
    top:40px;
    right:80px;
    width:80px;
    height:80px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 35%, #fff8dc, #ffd700);
    box-shadow:0 0 60px rgba(255,215,0,0.6), 0 0 100px rgba(255,215,0,0.3);
    animation:moonGlow 4s ease-in-out infinite;
  }
  @keyframes moonGlow {
    0%,100% { box-shadow:0 0 60px rgba(255,215,0,0.6), 0 0 100px rgba(255,215,0,0.3); }
    50% { box-shadow:0 0 80px rgba(255,215,0,0.9), 0 0 130px rgba(255,215,0,0.5); }
  }

  /* Awan */
  .cloud {
    position:absolute;
    background:rgba(255,255,255,0.15);
    border-radius:50px;
    backdrop-filter:blur(2px);
  }
  .cloud::before,
  .cloud::after {
    content:'';
    position:absolute;
    background:inherit;
    border-radius:50%;
  }
  .cloud.c1 {
    width:120px; height:40px;
    top:15%; left:5%;
    animation:cloudDrift 40s linear infinite;
  }
  .cloud.c1::before { width:60px; height:60px; top:-25px; left:15px; }
  .cloud.c1::after { width:50px; height:50px; top:-20px; right:15px; }

  .cloud.c2 {
    width:100px; height:35px;
    top:40%; left:60%;
    animation:cloudDrift 55s linear infinite;
    animation-delay:-20s;
  }
  .cloud.c2::before { width:50px; height:50px; top:-22px; left:12px; }
  .cloud.c2::after { width:40px; height:40px; top:-18px; right:12px; }

  .cloud.c3 {
    width:140px; height:45px;
    top:70%; left:30%;
    animation:cloudDrift 60s linear infinite;
    animation-delay:-40s;
  }
  .cloud.c3::before { width:70px; height:70px; top:-28px; left:20px; }
  .cloud.c3::after { width:55px; height:55px; top:-22px; right:20px; }

  @keyframes cloudDrift {
    from { transform:translateX(-200px); }
    to { transform:translateX(calc(100vw + 200px)); }
  }

  /* ===== Container ===== */
  .container {
    position:relative;
    z-index:5;
    max-width:1600px;
    margin:0 auto;
    padding:20px;
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }

  /* ===== Header ===== */
  .header {
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 25px;
    background:rgba(0,0,0,0.4);
    backdrop-filter:blur(20px);
    border-radius:20px;
    border:1px solid rgba(255,255,255,0.1);
    margin-bottom:20px;
    flex-wrap:wrap;
    gap:15px;
  }

  .header-title {
    display:flex;
    align-items:center;
    gap:15px;
  }

  .header-title h1 {
    color:var(--primary);
    font-size:1.5rem;
    font-weight:900;
    text-shadow:0 0 20px rgba(0,210,255,0.5);
  }

  .header-title .flag {
    font-size:2.5rem;
    animation:flagWave 2s ease-in-out infinite;
  }

  @keyframes flagWave {
    0%,100% { transform:rotate(0deg); }
    50% { transform:rotate(-10deg); }
  }

  .header-actions {
    display:flex;
    gap:10px;
    flex-wrap:wrap;
  }

  .header-btn {
    padding:10px 20px;
    border:none;
    border-radius:12px;
    font-family:'Tajawal',sans-serif;
    font-size:0.9rem;
    font-weight:700;
    cursor:pointer;
    transition:all 0.3s;
    display:flex;
    align-items:center;
    gap:8px;
  }

  .header-btn.add {
    background:linear-gradient(135deg,var(--success),#1e8449);
    color:#fff;
    box-shadow:0 4px 15px rgba(46,213,115,0.4);
  }
  .header-btn.reset {
    background:rgba(255,167,2,0.15);
    color:#ffa502;
    border:1px solid rgba(255,167,2,0.4);
  }
  .header-btn.export {
    background:rgba(155,89,182,0.15);
    color:#9b59b6;
    border:1px solid rgba(155,89,182,0.4);
  }
  .header-btn.import {
    background:rgba(0,184,148,0.15);
    color:#00b894;
    border:1px solid rgba(0,184,148,0.4);
  }
  .header-btn:hover {
    transform:translateY(-2px);
    filter:brightness(1.15);
  }

  /* ===== Leaderboard ===== */
  .leaderboard {
    background:linear-gradient(135deg, rgba(255,215,0,0.15), rgba(255,165,0,0.15));
    backdrop-filter:blur(20px);
    border:2px solid rgba(255,215,0,0.4);
    border-radius:20px;
    padding:20px;
    margin-bottom:20px;
    box-shadow:0 10px 40px rgba(255,215,0,0.2);
  }

  .leaderboard-title {
    color:var(--gold);
    font-size:1.3rem;
    font-weight:900;
    text-align:center;
    margin-bottom:15px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
  }

  .leaderboard-list {
    display:flex;
    justify-content:center;
    gap:20px;
    flex-wrap:wrap;
  }

  .leaderboard-item {
    background:rgba(0,0,0,0.3);
    border-radius:16px;
    padding:15px 25px;
    display:flex;
    align-items:center;
    gap:12px;
    border:2px solid rgba(255,255,255,0.1);
    transition:all 0.5s;
    min-width:180px;
    position:relative;
    overflow:hidden;
  }

  .leaderboard-item.rank-1 {
    border-color:var(--gold);
    background:linear-gradient(135deg, rgba(255,215,0,0.2), rgba(255,165,0,0.2));
    box-shadow:0 0 30px rgba(255,215,0,0.4);
    transform:scale(1.08);
    animation:winnerPulse 2s ease-in-out infinite;
  }

  .leaderboard-item.rank-2 {
    border-color:#C0C0C0;
    background:linear-gradient(135deg, rgba(192,192,192,0.2), rgba(150,150,150,0.2));
  }

  .leaderboard-item.rank-3 {
    border-color:#CD7F32;
    background:linear-gradient(135deg, rgba(205,127,50,0.2), rgba(160,100,40,0.2));
  }

  @keyframes winnerPulse {
    0%,100% { box-shadow:0 0 30px rgba(255,215,0,0.4); }
    50% { box-shadow:0 0 50px rgba(255,215,0,0.8); }
  }

  .rank-badge {
    font-size:2rem;
    flex-shrink:0;
    animation:rankBounce 1s ease-in-out infinite;
  }

  @keyframes rankBounce {
    0%,100% { transform:translateY(0); }
    50% { transform:translateY(-5px); }
  }

  .leaderboard-info {
    flex:1;
  }

  .leaderboard-name {
    color:#fff;
    font-weight:800;
    font-size:1rem;
    margin-bottom:4px;
  }

  .leaderboard-score {
    color:var(--gold);
    font-weight:900;
    font-size:1.3rem;
  }

  .leaderboard-jet {
    font-size:1.8rem;
    animation:jetHover 2s ease-in-out infinite;
  }

  @keyframes jetHover {
    0%,100% { transform:translateY(0) rotate(0deg); }
    50% { transform:translateY(-5px) rotate(-5deg); }
  }

  /* ===== Scoreboard Area ===== */
  .scoreboard-area {
    flex:1;
    background:rgba(0,0,0,0.3);
    backdrop-filter:blur(15px);
    border:1px solid rgba(255,255,255,0.1);
    border-radius:20px;
    padding:30px;
    position:relative;
    overflow:hidden;
    min-height:500px;
  }

  /* Garis-garis ketinggian */
  .height-lines {
    position:absolute;
    inset:0;
    pointer-events:none;
  }

  .height-line {
    position:absolute;
    left:0;
    right:0;
    height:1px;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,0.08), transparent);
    display:flex;
    align-items:center;
    padding-left:20px;
  }

  .height-line::before {
    content:attr(data-label);
    color:rgba(255,255,255,0.15);
    font-size:0.75rem;
    font-weight:700;
    position:absolute;
    left:15px;
    background:rgba(0,0,0,0.4);
    padding:2px 8px;
    border-radius:6px;
  }

  /* Grid kelompok */
  .teams-grid {
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(280px, 1fr));
    gap:20px;
    position:relative;
    z-index:2;
    padding-top:40px;
  }

  /* Kartu kelompok */
  .team-card {
    background:linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.03));
    backdrop-filter:blur(15px);
    border:2px solid rgba(255,255,255,0.15);
    border-radius:24px;
    padding:20px;
    position:relative;
    transition:all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    display:flex;
    flex-direction:column;
    min-height:400px;
    overflow:hidden;
  }

  .team-card:hover {
    transform:translateY(-5px);
    box-shadow:0 20px 50px rgba(0,0,0,0.4);
  }

  /* Pesawat terbang di kartu */
  .team-jet-area {
    flex:1;
    position:relative;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    min-height:200px;
    margin-bottom:15px;
  }

  /* Garis langit untuk pesawat */
  .sky-zone {
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    padding:5px 0;
    pointer-events:none;
  }

  .sky-zone-line {
    height:1px;
    background:rgba(255,255,255,0.05);
    border-radius:1px;
  }

  /* Pesawat */
  .jet {
    font-size:3.5rem;
    transition:transform 1s cubic-bezier(0.34, 1.56, 0.64, 1),
               filter 0.5s;
    filter:drop-shadow(0 4px 15px rgba(0,210,255,0.6));
    animation:jetBob 3s ease-in-out infinite;
    position:relative;
    z-index:3;
    transform-origin:center;
  }

  @keyframes jetBob {
    0%,100% { transform:translateY(-50%) translateX(0) rotate(-5deg); }
    50% { transform:translateY(calc(-50% - 8px)) translateX(4px) rotate(-8deg); }
  }

  /* Trail pesawat */
  .jet-trail {
    position:absolute;
    right:100%;
    top:50%;
    height:4px;
    width:0;
    background:linear-gradient(90deg, transparent, rgba(0,210,255,0.8));
    border-radius:2px;
    transform:translateY(-50%);
    transition:width 0.5s;
    pointer-events:none;
  }

  .jet:hover .jet-trail,
  .team-card.active .jet-trail {
    width:60px;
  }

  /* Info kelompok */
  .team-info {
    text-align:center;
    padding-top:15px;
    border-top:2px dashed rgba(255,255,255,0.1);
  }

  .team-name {
    font-size:1.2rem;
    font-weight:900;
    margin-bottom:8px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
  }

  .team-name-edit {
    background:transparent;
    border:none;
    color:inherit;
    font-family:'Tajawal',sans-serif;
    font-size:inherit;
    font-weight:inherit;
    text-align:center;
    width:100%;
    cursor:pointer;
    padding:4px 8px;
    border-radius:8px;
    transition:all 0.2s;
  }
  .team-name-edit:hover {
    background:rgba(255,255,255,0.1);
  }
  .team-name-edit:focus {
    outline:none;
    background:rgba(255,255,255,0.15);
    cursor:text;
  }

  .team-score-display {
    font-size:2.5rem;
    font-weight:900;
    color:var(--gold);
    text-shadow:0 0 20px rgba(255,215,0,0.5);
    line-height:1;
    margin-bottom:15px;
    transition:transform 0.3s;
  }

  .team-score-display.bump {
    animation:scoreBump 0.5s;
  }

  @keyframes scoreBump {
    0%,100% { transform:scale(1); }
    50% { transform:scale(1.3); color:#fff; }
  }

  /* Tombol poin */
  .score-buttons {
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:6px;
    margin-top:10px;
  }

  .score-btn {
    padding:10px 6px;
    border:none;
    border-radius:10px;
    font-family:'Tajawal',sans-serif;
    font-size:0.85rem;
    font-weight:900;
    cursor:pointer;
    transition:all 0.2s;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:2px;
  }

  .score-btn.plus-1 { background:linear-gradient(135deg, #2ed573, #1e8449); }
  .score-btn.plus-5 { background:linear-gradient(135deg, #00d2ff, #3a7bd5); }
  .score-btn.minus-1 { background:linear-gradient(135deg, #ffa502, #e67e22); }
  .score-btn.minus-5 { background:linear-gradient(135deg, #ff4757, #c0392b); }

  .score-btn:hover {
    transform:translateY(-2px) scale(1.05);
    filter:brightness(1.15);
    box-shadow:0 6px 20px rgba(0,0,0,0.3);
  }

  .score-btn:active {
    transform:translateY(0) scale(0.98);
  }

  /* Tombol hapus */
  .team-delete {
    position:absolute;
    top:10px;
    left:10px;
    width:30px;
    height:30px;
    border-radius:50%;
    background:rgba(255,71,87,0.2);
    border:1px solid rgba(255,71,87,0.5);
    color:#ff4757;
    font-size:1rem;
    font-weight:900;
    cursor:pointer;
    transition:all 0.2s;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:5;
    opacity:0;
    pointer-events:none;
  }

  .team-card:hover .team-delete {
    opacity:1;
    pointer-events:auto;
  }

  .team-delete:hover {
    background:var(--danger);
    color:#fff;
    transform:rotate(90deg) scale(1.1);
  }

  /* Tombol edit jet */
  .team-edit-jet {
    position:absolute;
    top:10px;
    right:10px;
    width:30px;
    height:30px;
    border-radius:50%;
    background:rgba(0,210,255,0.2);
    border:1px solid rgba(0,210,255,0.5);
    color:var(--primary);
    font-size:0.9rem;
    cursor:pointer;
    transition:all 0.2s;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:5;
    opacity:0;
    pointer-events:none;
  }

  .team-card:hover .team-edit-jet {
    opacity:1;
    pointer-events:auto;
  }

  .team-edit-jet:hover {
    background:var(--primary);
    color:#fff;
    transform:scale(1.1);
  }

  /* Empty state */
  .empty-state {
    grid-column:1/-1;
    text-align:center;
    padding:80px 20px;
    color:var(--text-muted);
  }

  .empty-state-icon {
    font-size:5rem;
    margin-bottom:20px;
    display:block;
    opacity:0.5;
    animation:jetHover 3s ease-in-out infinite;
  }

  .empty-state h3 {
    color:var(--text);
    font-size:1.5rem;
    margin-bottom:10px;
  }

  .empty-state p {
    font-size:1rem;
    line-height:1.6;
  }

  /* ===== Modal ===== */
  .modal {
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.85);
    backdrop-filter:blur(10px);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:500;
    padding:20px;
    overflow-y:auto;
  }
  .modal.show { display:flex; animation:fadeIn 0.3s; }

  @keyframes fadeIn {
    from { opacity:0; }
    to { opacity:1; }
  }

  .modal-content {
    background:linear-gradient(135deg, #2a2a5e, #1a1a3e);
    border:2px solid rgba(0,210,255,0.3);
    border-radius:24px;
    padding:30px;
    max-width:550px;
    width:100%;
    max-height:90vh;
    overflow-y:auto;
    animation:modalIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  @keyframes modalIn {
    from { transform:scale(0.9) translateY(20px); opacity:0; }
    to { transform:scale(1) translateY(0); opacity:1; }
  }

  .modal-title {
    color:var(--primary);
    font-size:1.5rem;
    font-weight:900;
    text-align:center;
    margin-bottom:20px;
  }

  .modal-close {
    position:absolute;
    top:15px;
    left:15px;
    width:35px;
    height:35px;
    border-radius:50%;
    background:rgba(255,255,255,0.1);
    border:none;
    color:#fff;
    font-size:1.2rem;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:all 0.3s;
  }

  .modal-close:hover {
    background:var(--danger);
    transform:rotate(90deg);
  }

  .modal-content {
    position:relative;
  }

  /* Form */
  .form-group {
    margin-bottom:15px;
  }

  .form-group label {
    display:block;
    color:var(--text-muted);
    font-size:0.9rem;
    font-weight:700;
    margin-bottom:8px;
  }

  .form-group input,
  .form-group select {
    width:100%;
    padding:12px 16px;
    border-radius:12px;
    border:2px solid rgba(255,255,255,0.15);
    background:rgba(255,255,255,0.08);
    color:var(--text);
    font-family:'Tajawal',sans-serif;
    font-size:1rem;
    font-weight:700;
    transition:all 0.3s;
  }

  .form-group input:focus,
  .form-group select:focus {
    outline:none;
    border-color:var(--primary);
    background:rgba(0,210,255,0.1);
  }

  /* Emoji picker */
  .emoji-grid {
    display:grid;
    grid-template-columns:repeat(8, 1fr);
    gap:8px;
    margin-top:8px;
  }

  .emoji-btn {
    aspect-ratio:1;
    border:2px solid rgba(255,255,255,0.1);
    border-radius:10px;
    background:rgba(255,255,255,0.05);
    font-size:1.5rem;
    cursor:pointer;
    transition:all 0.2s;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .emoji-btn:hover {
    background:rgba(0,210,255,0.2);
    border-color:var(--primary);
    transform:scale(1.1);
  }

  .emoji-btn.selected {
    background:linear-gradient(135deg, rgba(0,210,255,0.3), rgba(58,123,213,0.3));
    border-color:var(--primary);
    box-shadow:0 0 15px rgba(0,210,255,0.5);
    transform:scale(1.05);
  }

  /* Color picker */
  .color-grid {
    display:grid;
    grid-template-columns:repeat(8, 1fr);
    gap:8px;
    margin-top:8px;
  }

  .color-btn {
    aspect-ratio:1;
    border:3px solid rgba(255,255,255,0.15);
    border-radius:12px;
    cursor:pointer;
    transition:all 0.2s;
    position:relative;
  }

  .color-btn:hover {
    transform:scale(1.15);
    border-color:#fff;
  }

  .color-btn.selected {
    border-color:#fff;
    box-shadow:0 0 15px currentColor;
    transform:scale(1.1);
  }

  .color-btn.selected::after {
    content:'✓';
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-weight:900;
    font-size:1.2rem;
    text-shadow:0 0 5px rgba(0,0,0,0.8);
  }

  /* Modal buttons */
  .modal-actions {
    display:flex;
    gap:10px;
    margin-top:20px;
  }

  .modal-btn {
    flex:1;
    padding:14px 20px;
    border:none;
    border-radius:14px;
    font-family:'Tajawal',sans-serif;
    font-size:1rem;
    font-weight:800;
    cursor:pointer;
    transition:all 0.3s;
  }

  .modal-btn.save {
    background:linear-gradient(135deg, var(--success), #1e8449);
    color:#fff;
    box-shadow:0 8px 25px rgba(46,213,115,0.4);
  }

  .modal-btn.save:hover {
    transform:translateY(-2px);
    box-shadow:0 12px 30px rgba(46,213,115,0.6);
  }

  .modal-btn.cancel {
    background:rgba(255,255,255,0.1);
    color:var(--text);
    border:2px solid rgba(255,255,255,0.15);
  }

  .modal-btn.cancel:hover {
    background:rgba(255,255,255,0.2);
  }

  /* Toast */
  .toast {
    position:fixed;
    bottom:30px;
    left:50%;
    transform:translateX(-50%) translateY(100px);
    background:rgba(0,0,0,0.9);
    color:#fff;
    padding:14px 28px;
    border-radius:50px;
    font-weight:700;
    border:2px solid var(--primary);
    z-index:2000;
    opacity:0;
    transition:all 0.4s;
    font-size:0.95rem;
  }

  .toast.show {
    transform:translateX(-50%) translateY(0);
    opacity:1;
  }

  .toast.success { border-color:var(--success); color:var(--success); }
  .toast.error { border-color:var(--danger); color:var(--danger); }
  .toast.info { border-color:var(--primary); color:var(--primary); }

  /* Confetti */
  .confetti {
    position:fixed;
    width:12px;
    height:12px;
    top:-20px;
    z-index:999;
    animation:confettiFall 4s linear forwards;
    pointer-events:none;
  }

  @keyframes confettiFall {
    0% { transform:translateY(0) rotate(0deg); opacity:1; }
    100% { transform:translateY(100vh) rotate(720deg); opacity:0; }
  }

  /* Score popup */
  .score-popup {
    position:fixed;
    color:var(--gold);
    font-size:2.5rem;
    font-weight:900;
    z-index:3000;
    pointer-events:none;
    animation:scorePopup 1.2s ease-out forwards;
    text-shadow:0 0 30px rgba(255,215,0,0.8);
  }

  .score-popup.negative {
    color:var(--danger);
    text-shadow:0 0 30px rgba(255,71,87,0.8);
  }

  @keyframes scorePopup {
    0% { transform:translate(-50%, 0) scale(0.5); opacity:0; }
    30% { transform:translate(-50%, -30px) scale(1.3); opacity:1; }
    100% { transform:translate(-50%, -120px) scale(1); opacity:0; }
  }

  /* Responsive */
  @media (max-width:768px) {
    .header { flex-direction:column; align-items:stretch; }
    .header-title { justify-content:center; }
    .header-actions { justify-content:center; }
    .teams-grid { grid-template-columns:1fr; }
    .leaderboard-list { flex-direction:column; align-items:center; }
    .leaderboard-item { min-width:auto; width:100%; max-width:350px; }
    .emoji-grid { grid-template-columns:repeat(6, 1fr); }
  }
</style>
</head>
<body>

<!-- Sky Background -->
<div class="sky-bg">
  <div class="stars"></div>
  <div class="moon"></div>
  <div class="cloud c1"></div>
  <div class="cloud c2"></div>
  <div class="cloud c3"></div>
</div>

<div class="container">

  <!-- Header -->
  <div class="header">
    <div class="header-title">
      <span class="flag">🏁</span>
      <h1>لَوْحَةُ النِّقَاط — طَائِرَات</h1>
    </div>
    <div class="header-actions">
      <button class="header-btn add" id="addTeamBtn">
        ➕ إضافة فريق
      </button>
      <button class="header-btn reset" id="resetScoresBtn">
        🔄 تصفير النقاط
      </button>
      <button class="header-btn export" id="exportBtn">
        📤 تصدير
      </button>
      <button class="header-btn import" id="importBtn">
        📥 استيراد
      </button>
    </div>
  </div>

  <!-- Leaderboard -->
  <div class="leaderboard" id="leaderboard" style="display:none;">
    <div class="leaderboard-title">
      🏆 لَوْحَةُ المُتَصَدِّرِين
    </div>
    <div class="leaderboard-list" id="leaderboardList"></div>
  </div>

  <!-- Scoreboard Area -->
  <div class="scoreboard-area">
    <div class="height-lines" id="heightLines"></div>
    <div class="teams-grid" id="teamsGrid"></div>
  </div>

</div>

<!-- ===== Modal: Add/Edit Team ===== -->
<div class="modal" id="teamModal">
  <div class="modal-content">
    <button class="modal-close" id="closeTeamModal">&times;</button>

    <div class="modal-title" id="modalTitle">➕ إضافة فريق جديد</div>

    <!-- Team name -->
    <div class="form-group">
      <label>📝 اسم الفريق</label>
      <input type="text" id="teamNameInput" placeholder="مثال: الفريق الأزرق" maxlength="25">
    </div>

    <!-- Jet emoji picker -->
    <div class="form-group">
      <label>✈️ اختر الطائرة</label>
      <div class="emoji-grid" id="emojiGrid"></div>
    </div>

    <!-- Color picker -->
    <div class="form-group">
      <label>🎨 اختر اللون</label>
      <div class="color-grid" id="colorGrid"></div>
    </div>

    <!-- Actions -->
    <div class="modal-actions">
      <button class="modal-btn cancel" id="cancelTeamBtn">إلغاء</button>
      <button class="modal-btn save" id="saveTeamBtn">💾 حفظ</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   CONSTANTS
============================================================ */
const JET_EMOJIS = [
  '✈️', '🛩️', '🚀', '🛸', '🛰️', '🚁', '🛫', '🛬',
  '💺', '🎈', '🪂', '🎯', '⭐', '🔥', '⚡', '🌟',
  '🦅', '🐦', '🦆', '🦉', '🐉', '🦄', '🐺', '🦁'
];

const TEAM_COLORS = [
  { name: 'أزرق',    value: '#4A90D9' },
  { name: 'أحمر',    value: '#E74C3C' },
  { name: 'أخضر',    value: '#2ecc71' },
  { name: 'أصفر',    value: '#f1c40f' },
  { name: 'بنفسجي',  value: '#9b59b6' },
  { name: 'برتقالي', value: '#e67e22' },
  { name: 'وردي',    value: '#fd79a8' },
  { name: 'سماوي',   value: '#00d2ff' },
  { name: 'ذهبي',    value: '#FFD700' },
  { name: 'أرجواني', value: '#8e44ad' },
  { name: 'فيروزي',  value: '#1abc9c' },
  { name: 'أحمر داكن', value: '#c0392b' },
  { name: 'أزرق داكن', value: '#2c3e50' },
  { name: 'رمادي',   value: '#7f8c8d' },
  { name: 'بني',     value: '#8B4513' },
  { name: 'كحلي',    value: '#1a1a3e' }
];

const STORAGE_KEY = 'arab_scoreboard_jets_data';

/* ============================================================
   DEFAULT TEAMS
============================================================ */
const DEFAULT_TEAMS = [
  { id: 'team_a',  name: 'الفريق الأزرق',  jet: '✈️', color: '#4A90D9', score: 0 },
  { id: 'team_b',  name: 'الفريق الأحمر',  jet: '🚀', color: '#E74C3C', score: 0 },
  { id: 'team_c',  name: 'الفريق الأخضر',  jet: '🛸', color: '#2ecc71', score: 0 },
  { id: 'team_d',  name: 'الفريق الذهبي',  jet: '🛩️', color: '#FFD700', score: 0 },
];

/* ============================================================
   STATE
============================================================ */
const state = {
  teams: [],
  editingTeamId: null,
  selectedEmoji: '✈️',
  selectedColor: '#4A90D9',
};

/* ============================================================
   STORAGE
============================================================ */
function loadTeams() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const parsed = JSON.parse(saved);
      if (Array.isArray(parsed)) return parsed;
    }
  } catch (e) {}
  return JSON.parse(JSON.stringify(DEFAULT_TEAMS));
}

function saveTeams() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state.teams));
  } catch (e) {
    toast('⚠️ فشل الحفظ', 'error');
  }
}

/* ============================================================
   HELPERS
============================================================ */
function toArabic(num) {
  const d = ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];
  return String(num).split('').map(x => d[parseInt(x)] || x).join('');
}

function toast(msg, type = '') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show ' + type;
  setTimeout(() => el.classList.remove('show'), 2500);
}

function generateId() {
  return 'team_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7);
}

function hexToRgba(hex, alpha) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  return `rgba(${r}, ${g}, ${b}, ${alpha})`;
}

/* ============================================================
   RENDER: Height Lines
============================================================ */
function renderHeightLines(maxScore) {
  const container = document.getElementById('heightLines');
  container.innerHTML = '';

  // Buat 5 garis ketinggian
  const steps = 5;
  for (let i = steps; i >= 0; i--) {
    const line = document.createElement('div');
    line.className = 'height-line';
    const percent = (i / steps) * 100;
    line.style.top = `${100 - percent}%`;
    const scoreVal = Math.round((i / steps) * maxScore);
    line.dataset.label = `${toArabic(scoreVal)} نقطة`;
    container.appendChild(line);
  }
}

/* ============================================================
   RENDER: Teams Grid
============================================================ */
function renderTeams() {
  const grid = document.getElementById('teamsGrid');
  grid.innerHTML = '';

  if (state.teams.length === 0) {
    grid.innerHTML = `
      <div class="empty-state">
        <span class="empty-state-icon">✈️</span>
        <h3>لا توجد فرق بعد</h3>
        <p>اضغط على "إضافة فريق" لبدء اللعبة</p>
      </div>
    `;
    return;
  }

  const maxScore = Math.max(...state.teams.map(t => t.score), 10);

  state.teams.forEach(team => {
    const card = document.createElement('div');
    card.className = 'team-card';
    card.dataset.teamId = team.id;

    // Hitung ketinggian pesawat (0% = bawah, 100% = atas)
    const heightPercent = Math.min(100, Math.max(0, (team.score / maxScore) * 100));

    card.innerHTML = `
      <button class="team-delete" data-team-id="${team.id}" title="حذف الفريق">✖</button>
      <button class="team-edit-jet" data-team-id="${team.id}" title="تعديل الطائرة">✏️</button>

      <div class="team-jet-area">
        <div class="sky-zone">
          ${Array(5).fill('<div class="sky-zone-line"></div>').join('')}
        </div>
        <div class="jet" style="
          color: ${team.color};
          filter: drop-shadow(0 4px 15px ${hexToRgba(team.color, 0.6)});
          transform: translateY(${-heightPercent}%) rotate(-5deg);
        ">
          <div class="jet-trail" style="
            background: linear-gradient(90deg, transparent, ${hexToRgba(team.color, 0.8)});
          "></div>
          ${team.jet}
        </div>
      </div>

      <div class="team-info">
        <div class="team-name" style="color: ${team.color};">
          <input
            type="text"
            class="team-name-edit"
            value="${team.name}"
            data-team-id="${team.id}"
            maxlength="25"
          >
        </div>
        <div class="team-score-display" id="score-${team.id}" style="color: ${team.color}; text-shadow: 0 0 20px ${hexToRgba(team.color, 0.5)};">
          ${toArabic(team.score)}
        </div>
        <div class="score-buttons">
          <button class="score-btn plus-1"   data-team-id="${team.id}" data-delta="1">+١</button>
          <button class="score-btn plus-5"   data-team-id="${team.id}" data-delta="5">+٥</button>
          <button class="score-btn minus-1"  data-team-id="${team.id}" data-delta="-1">−١</button>
          <button class="score-btn minus-5"  data-team-id="${team.id}" data-delta="-5">−٥</button>
        </div>
      </div>
    `;

    grid.appendChild(card);
  });

  // Attach event listeners
  document.querySelectorAll('.score-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const teamId = btn.dataset.teamId;
      const delta = parseInt(btn.dataset.delta);
      changeScore(teamId, delta);
    });
  });

  document.querySelectorAll('.team-delete').forEach(btn => {
    btn.addEventListener('click', () => {
      const teamId = btn.dataset.teamId;
      deleteTeam(teamId);
    });
  });

  document.querySelectorAll('.team-edit-jet').forEach(btn => {
    btn.addEventListener('click', () => {
      const teamId = btn.dataset.teamId;
      openEditJetModal(teamId);
    });
  });

  document.querySelectorAll('.team-name-edit').forEach(input => {
    input.addEventListener('change', () => {
      const teamId = input.dataset.teamId;
      const team = state.teams.find(t => t.id === teamId);
      if (team) {
        team.name = input.value.trim() || team.name;
        saveTeams();
        updateLeaderboard();
      }
    });
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') input.blur();
    });
  });
}

/* ============================================================
   CHANGE SCORE
============================================================ */
function changeScore(teamId, delta) {
  const team = state.teams.find(t => t.id === teamId);
  if (!team) return;

  const oldScore = team.score;
  team.score = Math.max(0, team.score + delta);

  // Kalau tidak ada perubahan (sudah 0 dan mau kurangi)
  if (oldScore === team.score && delta < 0) {
    toast('⚠️ النقاط لا يمكن أن تكون أقل من صفر', 'error');
    return;
  }

  saveTeams();

  // Animasi bump di skor
  const scoreEl = document.getElementById(`score-${teamId}`);
  if (scoreEl) {
    scoreEl.classList.remove('bump');
    void scoreEl.offsetWidth;
    scoreEl.classList.add('bump');
  }

  // Score popup
  const card = document.querySelector(`[data-team-id="${teamId}"]`);
  if (card) {
    const rect = card.getBoundingClientRect();
    showScorePopup(
      (delta > 0 ? '+' : '') + toArabic(Math.abs(delta)),
      rect.left + rect.width / 2,
      rect.top + rect.height / 2,
      delta < 0
    );
  }

  // Sound effect
  if (delta > 0) playSound('correct');
  else playSound('wrong');

  // Confetti kalau naik banyak
  if (delta >= 5) launchConfetti(30);

  // Re-render + update leaderboard
  renderTeams();
  updateLeaderboard();
}

/* ============================================================
   SHOW SCORE POPUP
============================================================ */
function showScorePopup(text, x, y, isNegative = false) {
  const popup = document.createElement('div');
  popup.className = 'score-popup' + (isNegative ? ' negative' : '');
  popup.textContent = text;
  popup.style.left = x + 'px';
  popup.style.top = y + 'px';
  document.body.appendChild(popup);
  setTimeout(() => popup.remove(), 1200);
}

/* ============================================================
   LEADERBOARD
============================================================ */
function updateLeaderboard() {
  const leaderboard = document.getElementById('leaderboard');
  const list = document.getElementById('leaderboardList');

  if (state.teams.length === 0) {
    leaderboard.style.display = 'none';
    return;
  }

  leaderboard.style.display = 'block';

  // Sort by score desc
  const sorted = [...state.teams].sort((a, b) => b.score - a.score);

  list.innerHTML = '';
  sorted.forEach((team, idx) => {
    const rank = idx + 1;
    let rankIcon = '';
    let rankClass = '';
    if (rank === 1 && team.score > 0) { rankIcon = '🥇'; rankClass = 'rank-1'; }
    else if (rank === 2 && team.score > 0) { rankIcon = '🥈'; rankClass = 'rank-2'; }
    else if (rank === 3 && team.score > 0) { rankIcon = '🥉'; rankClass = 'rank-3'; }
    else { rankIcon = toArabic(rank); }

    const item = document.createElement('div');
    item.className = `leaderboard-item ${rankClass}`;
    item.innerHTML = `
      <div class="rank-badge">${rankIcon}</div>
      <div class="leaderboard-info">
        <div class="leaderboard-name" style="color: ${team.color};">${team.name}</div>
        <div class="leaderboard-score" style="color: ${team.color};">
          ${toArabic(team.score)} نقطة
        </div>
      </div>
      <div class="leaderboard-jet">${team.jet}</div>
    `;
    list.appendChild(item);
  });
}

/* ============================================================
   ADD TEAM
============================================================ */
const teamModal = document.getElementById('teamModal');
const teamNameInput = document.getElementById('teamNameInput');
const emojiGrid = document.getElementById('emojiGrid');
const colorGrid = document.getElementById('colorGrid');
const modalTitle = document.getElementById('modalTitle');

function renderEmojiPicker() {
  emojiGrid.innerHTML = '';
  JET_EMOJIS.forEach(emoji => {
    const btn = document.createElement('button');
    btn.className = 'emoji-btn';
    btn.textContent = emoji;
    btn.dataset.emoji = emoji;
    if (emoji === state.selectedEmoji) btn.classList.add('selected');
    btn.addEventListener('click', () => {
      state.selectedEmoji = emoji;
      document.querySelectorAll('.emoji-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
    });
    emojiGrid.appendChild(btn);
  });
}

function renderColorPicker() {
  colorGrid.innerHTML = '';
  TEAM_COLORS.forEach(color => {
    const btn = document.createElement('button');
    btn.className = 'color-btn';
    btn.style.background = color.value;
    btn.style.color = color.value;
    btn.dataset.color = color.value;
    btn.title = color.name;
    if (color.value === state.selectedColor) btn.classList.add('selected');
    btn.addEventListener('click', () => {
      state.selectedColor = color.value;
      document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
    });
    colorGrid.appendChild(btn);
  });
}

function openAddTeamModal() {
  state.editingTeamId = null;
  state.selectedEmoji = '✈️';
  state.selectedColor = '#4A90D9';
  teamNameInput.value = '';
  modalTitle.textContent = '➕ إضافة فريق جديد';
  renderEmojiPicker();
  renderColorPicker();
  teamModal.classList.add('show');
  setTimeout(() => teamNameInput.focus(), 200);
}

function openEditJetModal(teamId) {
  const team = state.teams.find(t => t.id === teamId);
  if (!team) return;

  state.editingTeamId = teamId;
  state.selectedEmoji = team.jet;
  state.selectedColor = team.color;
  teamNameInput.value = team.name;
  modalTitle.textContent = '✏️ تعديل الفريق';
  renderEmojiPicker();
  renderColorPicker();
  teamModal.classList.add('show');
}

function saveTeam() {
  const name = teamNameInput.value.trim();
  if (!name) {
    toast('⚠️ اكتب اسم الفريق', 'error');
    teamNameInput.focus();
    return;
  }

  if (state.editingTeamId) {
    // Edit mode
    const team = state.teams.find(t => t.id === state.editingTeamId);
    if (team) {
      team.name = name;
      team.jet = state.selectedEmoji;
      team.color = state.selectedColor;
    }
    toast('✅ تم التحديث', 'success');
  } else {
    // Add mode
    const newTeam = {
      id: generateId(),
      name,
      jet: state.selectedEmoji,
      color: state.selectedColor,
      score: 0,
    };
    state.teams.push(newTeam);
    toast('✅ تمت الإضافة', 'success');
  }

  saveTeams();
  renderTeams();
  updateLeaderboard();
  teamModal.classList.remove('show');
}

document.getElementById('addTeamBtn').addEventListener('click', openAddTeamModal);
document.getElementById('saveTeamBtn').addEventListener('click', saveTeam);
document.getElementById('cancelTeamBtn').addEventListener('click', () => teamModal.classList.remove('show'));
document.getElementById('closeTeamModal').addEventListener('click', () => teamModal.classList.remove('show'));

teamModal.addEventListener('click', (e) => {
  if (e.target === teamModal) teamModal.classList.remove('show');
});

/* ============================================================
   DELETE TEAM
============================================================ */
function deleteTeam(teamId) {
  const team = state.teams.find(t => t.id === teamId);
  if (!team) return;

  if (confirm(`حذف "${team.name}"؟`)) {
    state.teams = state.teams.filter(t => t.id !== teamId);
    saveTeams();
    renderTeams();
    updateLeaderboard();
    toast('🗑️ تم الحذف', 'success');
  }
}

/* ============================================================
   RESET SCORES
============================================================ */
document.getElementById('resetScoresBtn').addEventListener('click', () => {
  if (state.teams.length === 0) return;
  if (confirm('تصفير جميع النقاط؟ (لن يتم حذف الفرق)')) {
    state.teams.forEach(t => t.score = 0);
    saveTeams();
    renderTeams();
    updateLeaderboard();
    toast('🔄 تم تصفير النقاط', 'success');
  }
});

/* ============================================================
   EXPORT / IMPORT
============================================================ */
document.getElementById('exportBtn').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(state.teams, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'scoreboard-teams.json';
  a.click();
  URL.revokeObjectURL(url);
  toast('📤 تم التصدير', 'success');
});

document.getElementById('importBtn').addEventListener('click', () => {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json,application/json';
  input.onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const data = JSON.parse(ev.target.result);
        if (!Array.isArray(data)) throw new Error('bad');
        state.teams = data;
        saveTeams();
        renderTeams();
        updateLeaderboard();
        toast('📥 تم الاستيراد', 'success');
      } catch (err) {
        toast('⚠️ فشل الاستيراد', 'error');
      }
    };
    reader.readAsText(file);
  };
  input.click();
});

/* ============================================================
   SOUND EFFECT
============================================================ */
function playSound(type) {
  try {
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    if (type === 'correct') {
      osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
      osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.1);
      osc.type = 'sine';
    } else {
      osc.frequency.setValueAtTime(392, audioCtx.currentTime);
      osc.frequency.setValueAtTime(261.63, audioCtx.currentTime + 0.1);
      osc.type = 'sawtooth';
    }

    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);

    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.3);
  } catch (e) {}
}

/* ============================================================
   CONFETTI
============================================================ */
function launchConfetti(count = 50) {
  const colors = ['#FFD700', '#FF6B6B', '#4ECDC4', '#95E1D3', '#F38181', '#AA96DA'];
  for (let i = 0; i < count; i++) {
    setTimeout(() => {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = Math.random() * 100 + 'vw';
      c.style.background = colors[Math.floor(Math.random() * colors.length)];
      c.style.animationDelay = Math.random() * 0.5 + 's';
      c.style.animationDuration = (3 + Math.random() * 2) + 's';
      c.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 5000);
    }, i * 30);
  }
}

/* ============================================================
   KEYBOARD SHORTCUTS
============================================================ */
document.addEventListener('keydown', (e) => {
  if (teamModal.classList.contains('show')) return;
  if (e.target.tagName === 'INPUT') return;

  // 1-9: tambah poin ke tim tersebut
  const num = parseInt(e.key);
  if (num >= 1 && num <= 9 && state.teams[num - 1]) {
    changeScore(state.teams[num - 1].id, 1);
  }

  // Shift + 1-9: kurangi poin
  if (e.shiftKey && num >= 1 && num <= 9 && state.teams[num - 1]) {
    changeScore(state.teams[num - 1].id, -1);
  }
});

/* ============================================================
   INIT
============================================================ */
state.teams = loadTeams();
renderHeightLines(Math.max(...state.teams.map(t => t.score), 10));
renderTeams();
updateLeaderboard();

// Update height lines saat ada perubahan
const observer = new MutationObserver(() => {
  const maxScore = Math.max(...state.teams.map(t => t.score), 10);
  renderHeightLines(maxScore);
});
observer.observe(document.getElementById('teamsGrid'), { childList: true, subtree: true });
</script>
